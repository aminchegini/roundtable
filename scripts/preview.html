<!DOCTYPE html>
<!-- Browser preview of the webview with a fake extension host and sample data.
     Run `npm run build`, serve the repo root, open /scripts/preview.html. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roundtable preview</title>
<style>
  :root {
    --vscode-foreground: #cccccc; --vscode-editor-background: #1f1f1f; --vscode-font-family: -apple-system, system-ui, sans-serif;
    --vscode-font-size: 13px; --vscode-descriptionForeground: #9d9d9d; --vscode-button-foreground: #fff;
    --vscode-button-background: #0078d4; --vscode-button-hoverBackground: #026ec1; --vscode-button-secondaryForeground: #ccc;
    --vscode-button-secondaryBackground: #313131; --vscode-button-secondaryHoverBackground: #3c3c3c; --vscode-errorForeground: #f85149;
    --vscode-input-foreground: #ccc; --vscode-input-background: #313131; --vscode-panel-border: #2b2b2b; --vscode-focusBorder: #0078d4;
    --vscode-sideBar-background: #181818; --vscode-list-hoverBackground: #2a2d2e; --vscode-editor-inactiveSelectionBackground: #3a3d41;
    --vscode-editor-font-family: Menlo, monospace; --vscode-editor-font-size: 12px; --vscode-textCodeBlock-background: #2b2b2b;
    --vscode-textLink-foreground: #4daafc; --vscode-inputValidation-warningBorder: #b89500; --vscode-inputValidation-warningBackground: #352a05;
  }
</style>
<link rel="stylesheet" href="../dist/webview/main.css">
</head>
<body>
<div id="root"></div>
<script>
  const cfg = (id, name, color, model, role) => ({ id, name, color, role, model, effort: 'medium', permissionMode: 'default', allowedTools: [], disallowedTools: [], workspaceMode: 'shared' });
  let agents = [
    { config: cfg('ada', 'Ada', '#d97757', 'claude-fable-5-1', 'Architect.'), status: 'idle', costUsd: 0.21, tokens: { input: 0, output: 0 } },
    { config: cfg('rex', 'Rex', '#6a9bcc', 'claude-sonnet-5-5', 'Skeptic.'), status: 'speaking', costUsd: 0.09, tokens: { input: 0, output: 0 } },
    { config: cfg('kit', 'Kit', '#788c5d', 'claude-haiku-4-5-20251001', 'Pragmatist.'), status: 'idle', costUsd: 0, tokens: { input: 14000, output: 2200 } },
  ];
  let id = 1;
  agents[2].config.provider = 'codex'; agents[2].config.model = 'gpt-6-astra';
  const rooms = { activeRoomId: 'r1', rooms: [
    { id: 'r1', name: 'Architecture', kind: 'group', agentIds: ['ada', 'rex', 'kit'], pinned: true, createdAt: 0, lastActivity: 2 },
    { id: 'r2', name: 'Release prep', kind: 'group', agentIds: ['ada', 'kit'], pinned: false, createdAt: 0, lastActivity: 1 },
    { id: 'r3', name: 'Rex', kind: 'dm', agentIds: ['rex'], pinned: false, createdAt: 0, lastActivity: 0 },
  ] };
  const providers = [
    { id: 'claude', title: 'Claude', vendor: 'Anthropic', installed: true, authenticated: true, detail: 'Claude Code login', setupHint: '', models: [{ id: 'claude-fable-5-1', label: 'fable-5-1' }, { id: 'claude-sonnet-5-5', label: 'sonnet-5-5' }, { id: 'claude-haiku-4-5-20251001', label: 'haiku-4-5' }], enforcement: 'full', costUsd: true },
    { id: 'codex', title: 'Codex', vendor: 'OpenAI', installed: true, authenticated: true, detail: 'ChatGPT login (~/.codex), default model gpt-6-astra', setupHint: '', models: [{ id: 'gpt-6-astra', label: 'GPT-6 Astra' }, { id: 'gpt-5.5', label: 'GPT-5.5' }], enforcement: 'gates', costUsd: false },
    { id: 'gemini', title: 'Gemini', vendor: 'Google', installed: false, authenticated: false, detail: 'Gemini CLI not installed', setupHint: 'Install Gemini CLI (npm i -g @google/gemini-cli) and run `gemini` once to sign in.', models: [{ id: 'gemini-3-pro-preview', label: 'Gemini 3 Pro' }], enforcement: 'gates', costUsd: false },
    { id: 'copilot', title: 'Copilot', vendor: 'GitHub', installed: true, authenticated: false, detail: 'not signed in', setupHint: 'Run `copilot login`. Requires a Copilot subscription.', models: [{ id: 'auto', label: 'auto' }], enforcement: 'full', costUsd: false },
    { id: 'cursor', title: 'Cursor agent', vendor: 'Cursor', installed: true, authenticated: false, detail: 'installed, not signed in', setupHint: 'Run `agent login` in a terminal.', models: [{ id: 'auto', label: 'auto' }], enforcement: 'gates', costUsd: false, experimental: true },
  ];
  const messages = [
    { id: id++, from: 'user', text: 'Should the session cache live in Redis or in-process? @Ada first.', ts: 0 },
    { id: id++, from: 'ada', text: 'In-process with an interface in front of it. One node today, so Redis buys nothing yet:\n```ts\ninterface SessionStore { get(id: string): Session | undefined }\n```\n@Rex poke holes in that.', ts: 0 },
    { id: id++, from: 'system', text: 'Sol joined the room.', ts: 0 },
  ];
  const entry = (id, title, summary, layer, enabled, status, fields = [], config = {}, applies = true) => ({ id, title, summary, layer, applies, enabled, status, config, fields });
  let guardrails = {
    profile: 'TypeScript · npm · vitest · eslint · git', hasWorkspace: true,
    presets: [
      { id: 'solo', title: 'Solo', summary: 'Safety net only: dangerous shell commands, protected files, secrets.', guardrailIds: ['bash-safety', 'protected-paths', 'secrets-scan'] },
      { id: 'team', title: 'Team', summary: 'Solo + quality gates and project knowledge.', guardrailIds: ['bash-safety', 'protected-paths', 'secrets-scan', 'typecheck-gate', 'lint-gate', 'tests-gate', 'agents-md', 'adr', 'definition-of-done'] },
      { id: 'factory', title: 'Factory', summary: 'Team + boundaries, enforced ADRs, reviewer veto, spec-first, worktrees.', guardrailIds: [] },
    ],
    file: { preset: 'team', enabled: {}, disabled: ['lint-gate'] },
    entries: [
      entry('bash-safety', 'Shell safety', 'Blocks force pushes, recursive deletes outside the project, curl-into-shell, sudo.', 'gate', true, 'ready',
        [{ key: 'allowInstalls', label: 'Allow package installs', type: 'boolean' }, { key: 'extraDeny', label: 'Extra denied patterns (regex)', type: 'list' }], { allowInstalls: false, extraDeny: [] }),
      entry('protected-paths', 'Protected paths', 'Agents cannot edit files matching these globs.', 'gate', true, 'ready', [{ key: 'globs', label: 'Protected globs', type: 'list' }], { globs: ['.env', '.env.*', 'package-lock.json'] }),
      entry('secrets-scan', 'Secrets scan', 'Flags API keys and private keys the moment they are written.', 'gate', true, 'ready'),
      entry('typecheck-gate', 'Typecheck gate', 'Runs tsc after TypeScript edits and before an agent may finish.', 'gate', true, 'ready', [{ key: 'command', label: 'Command', type: 'text' }], { command: 'tsc --noEmit -p tsconfig.json' }),
      entry('lint-gate', 'Lint gate', 'Runs eslint on the files an agent changed.', 'gate', false, 'ready', [{ key: 'maxWarnings', label: 'Max warnings', type: 'number' }], { maxWarnings: 0 }),
      entry('tests-gate', 'Tests gate', 'Runs the test suite before an agent that changed code may finish.', 'gate', true, 'ready', [{ key: 'when', label: 'Run', type: 'select', options: ['whenEdited', 'always', 'off'] }], { when: 'whenEdited' }),
      entry('boundaries', 'Module boundaries', 'dependency-cruiser enforces docs/architecture.yml.', 'gate', false, 'missing-tool'),
      entry('agents-md', 'AGENTS.md', 'Project instructions every agent reads.', 'knowledge', true, 'needs-setup'),
      entry('architecture-map', 'Architecture map', 'docs/architecture.yml lists modules and allowed imports.', 'knowledge', false, 'needs-setup'),
      entry('adr', 'Architecture decision records', 'Agents record architecture decisions in docs/adr.', 'knowledge', true, 'needs-setup', [{ key: 'enforce', label: 'Block turns that change architecture files without an ADR', type: 'boolean' }], { enforce: false }),
      entry('definition-of-done', 'Definition of done', 'A checklist every implementation turn must satisfy.', 'knowledge', true, 'ready'),
      entry('reviewer-veto', 'Reviewer veto', 'One read-only reviewer must approve before others may edit.', 'process', false, 'needs-setup'),
      entry('spec-first', 'Spec first', 'Agents must submit a spec you approve before any code changes.', 'process', false, 'ready'),
      entry('worktree-per-implementer', 'Worktree per implementer', 'Every editing agent works in its own git worktree.', 'process', false, 'needs-setup'),
    ],
    setup: [
      { kind: 'write', description: 'Create AGENTS.md from detected commands and layout', detail: 'AGENTS.md' },
      { kind: 'write', description: 'Create docs/adr with the first ADR', detail: 'docs/adr/0001-record-architecture-decisions.md' },
    ],
    busy: false,
  };
  const send = (m) => window.postMessage(m, '*');
  window.acquireVsCodeApi = () => ({
    postMessage(m) {
      console.log('to host', m);
      if (m.type === 'ready') {
        send({ type: 'state', location: new URLSearchParams(location.search).get('loc') || 'editor',
          roomState: { agents, messages, room: { running: true, round: 0, maxRounds: 6, costUsd: 0.32, tokens: { input: 18000, output: 4000 }, budgetUsd: 2, locks: { review: 'awaiting reviewer approval' } },
            permissions: [{ requestId: '1', agentId: 'rex', toolName: 'Bash', detail: 'Bash: grep -rn "SessionStore" src/', canAlways: true }],
            spec: { status: 'pending', agentName: 'Ada', markdown: '## Requirements\n- Session cache behind `SessionStore`\n\n## Design\nIn-process map, interface in `src/shared`.\n\n## Tasks\n1. Add interface\n2. Add MemoryStore\n3. Tests' } },
          allAgents: agents, rooms, providers, guardrails });
        send({ type: 'partial', agentId: 'rex', text: 'Deploys wipe an in-process cache, so every release logs everyone out. Is that acceptable for `v1`?' });
        send({ type: 'activity', agentId: 'rex', text: 'Grep: SessionStore' });
      }
      if (m.type === 'send') send({ type: 'message', message: { id: id++, from: 'user', text: m.text, ts: 0 } });
      if (m.type === 'permissionResponse') send({ type: 'permissions', permissions: [] });
      if (m.type === 'setGuardrails') { guardrails = { ...guardrails, file: m.file, entries: guardrails.entries.map((e) => ({ ...e, enabled: m.file.preset === 'factory' ? e.applies : (m.file.enabled[e.id] !== undefined || (guardrails.presets.find((p) => p.id === m.file.preset)?.guardrailIds.includes(e.id) ?? false)) && !m.file.disabled.includes(e.id) })) }; send({ type: 'guardrails', guardrails }); }
      if (m.type === 'applySetup') { guardrails = { ...guardrails, setup: [], busy: false }; send({ type: 'guardrails', guardrails }); send({ type: 'message', message: { id: id++, from: 'system', text: 'Guardrail setup: wrote AGENTS.md, docs/adr/0001-record-architecture-decisions.md.', ts: 0 } }); }
      if (m.type === 'specDecision') { send({ type: 'spec', spec: undefined }); send({ type: 'message', message: { id: id++, from: 'user', text: 'Spec approved. Go ahead and implement it.', ts: 0 } }); }
      if (m.type === 'switchRoom') { rooms.activeRoomId = m.id; send({ type: 'rooms', rooms }); }
      if (m.type === 'renameRoom') { rooms.rooms.find((r) => r.id === m.id).name = m.name; send({ type: 'rooms', rooms }); }
      if (m.type === 'pinRoom') { rooms.rooms.find((r) => r.id === m.id).pinned = m.pinned; send({ type: 'rooms', rooms }); }
      if (m.type === 'saveAgent') { agents = agents.map((a) => a.config.id === m.config.id ? { ...a, config: m.config } : a); send({ type: 'agents', agents }); }
    },
  });
</script>
<script src="../dist/webview/main.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2f45"/>
      <stop offset="1" stop-color="#0e1017"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.52" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <!-- full-bleed background: no transparent corners, so no white frame anywhere -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- table -->
  <circle cx="256" cy="268" r="84" fill="none" stroke="#f3efe8" stroke-width="22"/>
  <circle cx="256" cy="268" r="30" fill="#f3efe8" fill-opacity="0.12"/>
  <!-- spokes -->
  <g stroke="#f3efe8" stroke-width="18" stroke-linecap="round" opacity="0.9">
    <path d="M256 184v-42"/>
    <path d="M183 310l-36 21"/>
    <path d="M329 310l36 21"/>
  </g>
  <!-- seats with soft glow -->
  <g filter="url(#soft)" opacity="0.55">
    <circle cx="256" cy="104" r="40" fill="#e0734f"/>
    <circle cx="114" cy="352" r="40" fill="#5f9bd8"/>
    <circle cx="398" cy="352" r="40" fill="#8fb36a"/>
  </g>
  <circle cx="256" cy="104" r="38" fill="#e0734f"/>
  <circle cx="114" cy="352" r="38" fill="#5f9bd8"/>
  <circle cx="398" cy="352" r="38" fill="#8fb36a"/>
  <!-- highlights -->
  <circle cx="244" cy="92" r="11" fill="#ffffff" fill-opacity="0.35"/>
  <circle cx="102" cy="340" r="11" fill="#ffffff" fill-opacity="0.35"/>
  <circle cx="386" cy="340" r="11" fill="#ffffff" fill-opacity="0.35"/>
</svg>
